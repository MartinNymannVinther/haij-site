# Production compose for haij.dk, designed to be run by Coolify on the same
# EU VPS as the tools. No secrets, no volumes, no database: the site is files.

services:
  site:
    build:
      context: .
    restart: unless-stopped
    # No published port. Coolify's proxy reaches nginx over the compose
    # network and terminates TLS in front of it; publishing 8080 on the host
    # would also collide with the proxy's own 8080. Running this without a
    # proxy: bind loopback explicitly with an override file and put one in
    # front, e.g. ports: ["127.0.0.1:8080:8080"].
    expose:
      - "8080"
