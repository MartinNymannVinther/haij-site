# nginx for haij.dk: static files, sensible caching, a few security headers,
# and www -> apex. Runs as the unprivileged nginx image, so port 8080.

server {
    listen 8080;
    server_name haij.dk www.haij.dk localhost;
    root /usr/share/nginx/html;
    index index.html;

    # One canonical host. TLS terminates in front of us (Coolify/Traefik), so
    # the redirect is to https regardless of what reached this container.
    if ($host = www.haij.dk) {
        return 301 https://haij.dk$request_uri;
    }

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next's static export ships its hydration data as inline scripts, so
    # script-src needs 'unsafe-inline'. Nothing is loaded from other hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets never change; everything else is revalidated.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
