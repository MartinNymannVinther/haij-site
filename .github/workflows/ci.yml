name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t haij-site:ci .
      - name: Serve and check the health endpoint and the redirect
        run: |
          docker run -d --name site -p 8080:8080 haij-site:ci
          sleep 3
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/ | grep -q 200
          curl -fsS -o /dev/null -w "%{http_code} %{redirect_url}\n" -H "Host: www.haij.dk" http://127.0.0.1:8080/ | grep -q "301 https://haij.dk/"
          docker rm -f site
